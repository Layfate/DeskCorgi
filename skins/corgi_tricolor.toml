# DeskCorgi skin. Every value is optional except format_version, name and palette.body.
format_version = 1
name = "Tricolor Corgi"
author = "DeskCorgi"

[palette]
body = "#3E363A"
body_shade = "#302A2D"
belly = "#FFF8EE"
legs = "#3E363A"
paws = "#FFF8EE"
pads = "#F29CA3"
ear_outer = "#453C40"
ear_inner = "#F6C3B6"
nose = "#221A1C"
mouth = "#3A2A2A"
tongue = "#FF869E"
tail = "#3E363A"
tail_tip = "#FFF8EE"
outline = "#261E21"
blush = "#FF8F9A"
markings = "#D88C4E"

[shape]
body_width = 1.12  # 0.85 to 1.35
leg_length = 0.6  # 0.5 to 1.2
head_scale = 1.05  # 0.85 to 1.2
muzzle_length = 0.95  # 0.6 to 1.4
ear_size = 1.12  # 0.6 to 1.5
ear_spread = 0.3  # -0.2 to 0.8
ear_pointiness = 0.66  # 0.5 to 1.5
eye_size = 1.2  # 0.7 to 1.4
eye_lid = 0.0  # 0.0 to 0.5
eye_slant = 0.0  # -0.3 to 0.3
cheek_fluff = 0.55  # 0.0 to 1.5
butt_fluff = 1.25  # 0.8 to 1.4
tail_length = 0.7  # 0.3 to 1.4
sock_length = 0.58  # 0.0 to 1.0
tail_style = "stub"  # stub, curl or plume
face = "blaze"  # none, blaze or urajiro
chest = "ruff"  # none, ruff or bib
brows = false

