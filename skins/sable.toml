# DeskCorgi skin. Every value is optional except format_version, name and palette.body.
format_version = 1
name = "Sable Corgi"
author = "DeskCorgi"

[palette]
body = "#C96E37"
body_shade = "#E29352"
belly = "#FFF8EE"
legs = "#C96E37"
paws = "#FFF8EE"
pads = "#F29CA3"
ear_outer = "#A85A2E"
ear_inner = "#F6C2B2"
nose = "#2E1F1A"
mouth = "#4A2B22"
tongue = "#FF869E"
tail = "#C96E37"
tail_tip = "#FFF8EE"
outline = "#4E2A17"
blush = "#FF8F8F"
markings = "#8E4C27"

[shape]
