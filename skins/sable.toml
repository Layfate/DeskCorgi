leg_length = 0.6  # 0.5 to 1.2
head_scale = 1.14  # 0.85 to 1.2
muzzle_length = 0.85  # 0.6 to 1.4
ear_size = 1.08  # 0.6 to 1.5
ear_spread = 0.45  # -0.2 to 0.8
ear_pointiness = 0.58  # 0.5 to 1.5
eye_size = 1.4  # 0.7 to 1.4
eye_lid = 0.0  # 0.0 to 0.5
eye_slant = 0.0  # -0.3 to 0.3
cheek_fluff = 0.9  # 0.0 to 1.5
butt_fluff = 1.25  # 0.8 to 1.4
tail_length = 0.7  # 0.3 to 1.4
sock_length = 0.5  # 0.0 to 1.0
tail_style = "stub"  # stub, curl or plume
face = "blaze"  # none, blaze or urajiro
chest = "ruff"  # none, ruff or bib
brows = false

