# DeskCorgi art: the hand-drawn shapes of the dog, as SVG path data.
# Spaces, ids and the edit loop are documented in art/README.md.
# Check:   cargo run -q -p deskcorgi-core --example art -- check
# Preview: cargo run -q -p deskcorgi-core --example art -- sheet
#
# Style: a chibi plush corgi. A round "mochi" head that is widest at the chubby cheeks, big
# low-set eyes, a short teardrop blaze, a small button nose, rounded ears and a fluffy bib.
format_version = 1

[style]
head_ink = 2.4
ear_ink = 2.2
tail_ink = 2.1
head_ink_drop = 0.8
head_shade = 0.28
chin_shadow = 0.2
rim_light = 0.22
crown_shine = 0.24
ear_inner_fade = 0.45

# ---- head space: face centre at 0,0; skull half-size 62 x 52; eyes at ±24,8 ----------------

[[part]]
id = "head"
symmetric = true
note = "Mochi silhouette: soft round crown, widest low at the chubby cheeks, a full round chin. Cheek fluff from the skin is added on top. turn = the head turned to the viewer's right: the chin follows the muzzle, the far cheek (left) shows more skull."
d = """
M 0 -50
C 27 -50 50 -42 57 -17
C 63 6 62 30 41 42
C 25 51 -25 51 -41 42
C -62 30 -63 6 -57 -17
C -50 -42 -27 -50 0 -50 Z
"""
turn = """
M 3 -50.5
C 29 -50.5 49 -41 55.5 -17
C 60.5 6 60 30 47 42.5
C 33 51.5 -7 52 -33 43
C -58 32 -65 8 -60 -17
C -53 -42 -25 -50.5 3 -50.5 Z
"""

[[part]]
id = "face.blaze"
symmetric = true
note = "Short teardrop blaze from the forehead between the eyes, flowing into a white muzzle and round white cheeks that tuck under the eyes. Clipped by the head."
d = """
M 0 -33
C 2.8 -33 4.2 -31 4.4 -27
C 4.8 -19 5.4 -11 6.4 -4
C 7.4 4 8 14 10.5 19
C 14 25 20 28.5 27 28.5
C 36 28.5 45 23 53 18
C 62 12.5 75 30 67 42
C 57 58 26 72 0 72
C -26 72 -57 58 -67 42
C -75 30 -62 12.5 -53 18
C -45 23 -36 28.5 -27 28.5
C -20 28.5 -14 25 -10.5 19
C -8 14 -7.4 4 -6.4 -4
C -5.4 -11 -4.8 -19 -4.4 -27
C -4.2 -31 -2.8 -33 0 -33 Z
"""

[[part]]
id = "face.urajiro"
symmetric = true
note = "Shiba-style cream cheeks (imported skins only)."
d = """
M -66 8
C -62 1.83 -51.83 6.17 -46 7
C -40.17 7.83 -35.83 12.5 -31 13
C -26.17 13.5 -20.67 11.17 -17 10
C -13.33 8.83 -11.83 6.33 -9 6
C -6.17 5.67 -3 8 0 8
C 3 8 6.17 5.67 9 6
C 11.83 6.33 13.33 8.83 17 10
C 20.67 11.17 26.17 13.5 31 13
C 35.83 12.5 40.17 7.83 46 7
C 51.83 6.17 62 1.83 66 8
C 70 14.17 81 33 70 44
C 59 55 23.33 74 0 74
C -23.33 74 -59 55 -70 44
C -81 33 -70 14.17 -66 8 Z
"""

[[part]]
id = "muzzle"
symmetric = true
note = "A small round snout, raised 5 units off the face dome. Width scales with the skin's muzzle_length."
d = "M -17 27 A 17 12 0 1 0 17 27 A 17 12 0 1 0 -17 27 Z"

[[part]]
id = "blush"
note = "Viewer-left cheek, a soft oval just under and outside the eye; mirrored for the right one."
d = "M -52 25 A 12 8.5 0 1 0 -28 25 A 12 8.5 0 1 0 -52 25 Z"

# ---- feature space: a small frame stuck to the face dome, y down --------------------------------

[[part]]
id = "brow"
symmetric = true
note = "Shiba eyebrow dot, placed at ±16,-21 on the face (skins with brows = true)."
d = "M -5.6 0 A 5.6 3.3 0 1 0 5.6 0 A 5.6 3.3 0 1 0 -5.6 0 Z"

[[part]]
id = "nose"
symmetric = true
note = "Small rounded button nose, centred on the muzzle tip."
d = """
M -7 -3
C -7 -7 7 -7 7 -3
C 7 0.6 3 4.2 0 4.5
C -3 4.2 -7 0.6 -7 -3 Z
"""

[[part]]
id = "nose.shine"
d = "M -4.6 -3.6 A 2.4 1.2 0 1 0 0.2 -3.6 A 2.4 1.2 0 1 0 -4.6 -3.6 Z"

# ---- ear space: base from -50,0 (inner) to 50,0 (outer), tip at 0,-100 -------------------------

[[part]]
id = "ear.outer"
symmetric = true
note = "Big soft corgi ear with a rounded tip. Drawn at the Corgi's ear_pointiness (0.66); the skin narrows or widens the tip."
d = """
M -50 0
C -54 -44 -34 -82 -12 -96
C -5 -101 5 -101 12 -96
C 34 -82 54 -44 50 0
C 20 9 -20 9 -50 0 Z
"""

[[part]]
id = "ear.inner"
symmetric = true
note = "turn = ear seen edge-on (the head turns towards its side): the near rim hides the inner side of the pink."
d = """
M -31 -4
C -29 -34 -16 -60 -6.5 -74
Q 0 -79.5 6.5 -74
C 16 -60 29 -34 31 -4
C 12 1 -12 1 -31 -4 Z
"""
turn = """
M -14 -5
C -13 -34 -4 -59 1.5 -73
Q 5.5 -78.5 10 -73
C 17 -60 30 -34 32 -5
C 18 0 2 0 -14 -5 Z
"""

[[part]]
id = "ear.tuft"
note = "Fluffy fur tufts rising from the inner base of the ear (belly colour). Clipped by the ear."
d = """
M -32 -2
C -30 -16 -25 -31 -15 -43
C -17 -32 -15 -23 -10 -16
C -8 -28 -2 -37 5 -42
C 0 -30 2 -19 8 -9
C 10 -18 15 -25 22 -27
C 17 -18 17 -8 19 0
C 4 2 -18 2 -32 -2 Z
"""

[[part]]
id = "ear.fur"
note = "Fur line inside the ear (stroke)."
d = "M 0 -18 L 3 -48"
turn = "M 7 -18 L 9 -46"

# ---- body space: seat at 0,0, neck at 0,-134, x to the viewer's right ---------------------------

[[part]]
id = "torso"
symmetric = true
note = "A soft pear: narrow under the head, round tummy and big fluffy hips. Drawn at butt_fluff 1.25: the skin moves the hips in or out. Legs blend into this outline."
d = """
M 0 -134
C 24 -134 40 -122 42 -100
C 44 -78 60 -57 65 -29
C 68 -5 51 9 0 9
C -51 9 -68 -5 -65 -29
C -60 -57 -44 -78 -42 -100
C -40 -122 -24 -134 0 -134 Z
"""

[[part]]
id = "chest.ruff"
symmetric = true
note = "Fluffy cloud bib: three soft round scallops, the middle one biggest. Clipped by the torso. Kept within ±32 so it never reaches the shoulders (±40)."
d = """
M -26 -140 L 26 -140
C 31 -116 31.5 -94 27 -76
C 25 -63 15 -60 13 -70
C 10 -55 -10 -55 -13 -70
C -15 -60 -25 -63 -27 -76
C -31.5 -94 -31 -116 -26 -140 Z
"""

[[part]]
id = "chest.bib"
symmetric = true
d = """
M -27 -142
C -4 -142 4 -142 27 -142
C 32 -108 24 -66 0 -44
C -24 -66 -32 -108 -27 -142 Z
"""
